<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hub-assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive physics simulations that run in the browser: choose a laboratory, then an experiment." />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>Virtual Physics Lab</title>
    <script>try{var t=localStorage.getItem('vlabs:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body data-page="chooser">
    <div id="app"></div>
    <noscript><div class="lp-noscript"><p>This site needs JavaScript to list the experiments.</p></div></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
